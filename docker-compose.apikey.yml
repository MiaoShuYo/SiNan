version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: sinan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: sinan
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sinan-server:
    build:
      context: .
      dockerfile: ./SiNan.Server/Dockerfile
    container_name: sinan-server
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Data__Provider: MySql
      ConnectionStrings__SiNan: "Server=mysql;Port=3306;Database=sinan;User=root;Password=${MYSQL_ROOT_PASSWORD:-root};"
      # API key authentication
      Auth__Enabled: "true"
      # Admin key: IsAdmin=true, no restrictions (empty lists = allow all)
      Auth__ApiKeys__0__Key: "${SINAN_ADMIN_KEY}"
      Auth__ApiKeys__0__Actor: "admin"
      Auth__ApiKeys__0__IsAdmin: "true"
      # App key: restricted to default namespace / DEFAULT_GROUP, limited actions only
      Auth__ApiKeys__1__Key: "${SINAN_APP_KEY}"
      Auth__ApiKeys__1__Actor: "app"
      Auth__ApiKeys__1__IsAdmin: "false"
      Auth__ApiKeys__1__Namespaces__0: "default"
      Auth__ApiKeys__1__Groups__0: "DEFAULT_GROUP"
      Auth__ApiKeys__1__AllowedActions__0: "registry.register"
      Auth__ApiKeys__1__AllowedActions__1: "registry.deregister"
      Auth__ApiKeys__1__AllowedActions__2: "registry.heartbeat"
      Auth__ApiKeys__1__AllowedActions__3: "registry.read"
      Auth__ApiKeys__1__AllowedActions__4: "config.read"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sinan-console:
    build:
      context: .
      dockerfile: ./SiNan.Console/Dockerfile
    container_name: sinan-console
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SiNanServer__BaseUrl: "http://sinan-server:8080"
      ConnectionStrings__ConsoleDb: "Data Source=/data/console-auth.db"
      Auth__BootstrapAdmin__UserName: "${CONSOLE_ADMIN_USER:-admin}"
      Auth__BootstrapAdmin__Password: "${CONSOLE_ADMIN_PASSWORD}"
    ports:
      - "5110:8080"
    volumes:
      - console_data:/data
    depends_on:
      sinan-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sinan-server-sqlite:
    profiles:
      - sqlite
    build:
      context: .
      dockerfile: ./SiNan.Server/Dockerfile
    container_name: sinan-server-sqlite
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Data__Provider: Sqlite
      ConnectionStrings__SiNan: "Data Source=/data/sinan.db"
      # API key authentication
      Auth__Enabled: "true"
      # Admin key: IsAdmin=true, no restrictions (empty lists = allow all)
      Auth__ApiKeys__0__Key: "${SINAN_ADMIN_KEY}"
      Auth__ApiKeys__0__Actor: "admin"
      Auth__ApiKeys__0__IsAdmin: "true"
      # App key: restricted to default namespace / DEFAULT_GROUP, limited actions only
      Auth__ApiKeys__1__Key: "${SINAN_APP_KEY}"
      Auth__ApiKeys__1__Actor: "app"
      Auth__ApiKeys__1__IsAdmin: "false"
      Auth__ApiKeys__1__Namespaces__0: "default"
      Auth__ApiKeys__1__Groups__0: "DEFAULT_GROUP"
      Auth__ApiKeys__1__AllowedActions__0: "registry.register"
      Auth__ApiKeys__1__AllowedActions__1: "registry.deregister"
      Auth__ApiKeys__1__AllowedActions__2: "registry.heartbeat"
      Auth__ApiKeys__1__AllowedActions__3: "registry.read"
      Auth__ApiKeys__1__AllowedActions__4: "config.read"
    ports:
      - "8081:8080"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  sqlite_data:
  console_data:
