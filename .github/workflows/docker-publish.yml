name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: dockerhub.miaoshuhub.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sinan_server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SiNan.Server/Dockerfile
          push: true
          tags: |
            dockerhub.miaoshuhub.com/sinan/sinan_server:latest
            dockerhub.miaoshuhub.com/sinan/sinan_server:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sinan_console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SiNan.Console/Dockerfile
          push: true
          tags: |
            dockerhub.miaoshuhub.com/sinan/sinan_console:latest
            dockerhub.miaoshuhub.com/sinan/sinan_console:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
